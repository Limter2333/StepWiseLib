<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dropdown Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            min-width: 200px;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 8px; display: block; color: #333; text-decoration: none; }
        .dropdown-item:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <h1>Dropdown Test</h1>

    <div class="dropdown">
        <button id="apiDropdown">高级API ▾</button>
        <div class="dropdown-menu" id="apiMenu">
            <div>API 文档</div>
            <a href="#" class="dropdown-item">POST /api/chat/chat</a>
            <a href="#" class="dropdown-item">GET /api/chat/sessions</a>
            <a href="#" class="dropdown-item">POST /api/rag/query</a>
            <a href="#" class="dropdown-item">GET /api/agents/status</a>
            <a href="#" class="dropdown-item">GET /api/monitoring/health</a>
        </div>
    </div>

    <script>
        const apiDropdown = document.getElementById('apiDropdown');
        const apiMenu = document.getElementById('apiMenu');
        console.log('Elements:', apiDropdown, apiMenu);
        if (apiDropdown && apiMenu) {
            apiDropdown.addEventListener('click', function(e) {
                console.log('Clicked!');
                e.preventDefault();
                apiMenu.classList.toggle('show');
            });
        }
    </script>
</body>
</html>
