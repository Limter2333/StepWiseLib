<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Realtime - AI Multi-Agent</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-card-hover: #222233;
            --accent-cyan: #00f5ff;
            --accent-purple: #bf00ff;
            --accent-pink: #ff006e;
            --accent-green: #00ff88;
            --accent-yellow: #ffbe2e;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --text-muted: #555566;
            --border-subtle: rgba(255,255,255,0.08);
            --glow-cyan: 0 0 30px rgba(0,245,255,0.3);
            --glow-purple: 0 0 30px rgba(191,0,255,0.3);
            --glow-green: 0 0 20px rgba(0,255,136,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .dashboard {
            padding: 100px 50px 50px;
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle { color: var(--text-secondary); margin-bottom: 40px; }

        /* Connection Status */
        .connection-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 30px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: relative;
        }

        .status-indicator::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid;
            border-color: inherit;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .status-indicator.disconnected {
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        .status-indicator.connecting {
            background: var(--accent-yellow);
            border-color: var(--accent-yellow);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-text {
            font-weight: 600;
        }

        .status-text.connected { color: var(--accent-green); }
        .status-text.disconnected { color: var(--accent-red); }
        .status-text.connecting { color: var(--accent-yellow); }

        .connection-info {
            display: flex;
            gap: 30px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .connection-info span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ws-url {
            font-family: 'Space Mono', monospace;
            color: var(--accent-cyan);
        }

        .connect-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .connect-btn.connect {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: var(--bg-primary);
        }

        .connect-btn.disconnect {
            background: var(--bg-secondary);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
        }

        .connect-btn:hover {
            transform: translateY(-2px);
        }

        /* Agent Grid */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .agent-card:hover {
            transform: translateY(-5px);
        }

        .agent-card.active {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .agent-card.working {
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
        }

        .agent-card.error {
            border-color: var(--accent-red);
        }

        .agent-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
        }

        .agent-avatar.pm { background: linear-gradient(135deg, var(--accent-purple), #ff00ff); }
        .agent-avatar.dev { background: linear-gradient(135deg, var(--accent-green), #00ff88); }
        .agent-avatar.test { background: linear-gradient(135deg, var(--accent-pink), #ff006e); }
        .agent-avatar.doc { background: linear-gradient(135deg, var(--accent-cyan), #00f5ff); }
        .agent-avatar.rag { background: linear-gradient(135deg, var(--accent-yellow), #ffbe2e); }

        .agent-status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid var(--bg-card);
        }

        .agent-status-dot.online { background: var(--accent-green); }
        .agent-status-dot.busy { background: var(--accent-yellow); }
        .agent-status-dot.offline { background: var(--text-muted); }

        .agent-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .agent-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .agent-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border-subtle);
        }

        .agent-metric {
            text-align: center;
        }

        .agent-metric-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .agent-metric-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Realtime Activity Feed */
        .activity-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .activity-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 25px;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .activity-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .activity-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
        }

        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 10px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .activity-icon.chat { background: rgba(0, 245, 255, 0.15); }
        .activity-icon.rag { background: rgba(191, 0, 255, 0.15); }
        .activity-icon.agent { background: rgba(0, 255, 136, 0.15); }
        .activity-icon.error { background: rgba(255, 0, 110, 0.15); }
        .activity-icon.success { background: rgba(0, 255, 136, 0.15); }

        .activity-content { flex: 1; }
        .activity-message { font-size: 0.9rem; margin-bottom: 5px; }
        .activity-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Event Log */
        .event-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 25px;
        }

        .event-log {
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }

        .event-item {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            gap: 10px;
        }

        .event-item.info { background: rgba(0, 245, 255, 0.1); }
        .event-item.success { background: rgba(0, 255, 136, 0.1); }
        .event-item.warning { background: rgba(255, 190, 46, 0.1); }
        .event-item.error { background: rgba(255, 0, 110, 0.1); }

        .event-time { color: var(--text-muted); }
        .event-type { font-weight: 600; min-width: 80px; }
        .event-type.info { color: var(--accent-cyan); }
        .event-type.success { color: var(--accent-green); }
        .event-type.warning { color: var(--accent-yellow); }
        .event-type.error { color: var(--accent-pink); }
        .event-msg { color: var(--text-secondary); flex: 1; }

        /* Canvas Visualization */
        .canvas-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .canvas-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .canvas-container {
            position: relative;
            height: 200px;
        }

        #agentNetworkCanvas {
            width: 100%;
            height: 100%;
        }

        /* Performance Metrics */
        .perf-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .perf-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
        }

        .perf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .perf-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .perf-icon {
            font-size: 1.2rem;
        }

        .perf-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .perf-chart {
            height: 40px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            margin-top: 10px;
        }

        .perf-bar {
            flex: 1;
            border-radius: 2px;
            transition: height 0.3s ease;
            min-height: 3px;
        }

        /* Refresh Button */
        .refresh-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            padding: 8px 15px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .refresh-btn:hover {
            background: var(--bg-card-hover);
            color: var(--accent-cyan);
        }

        @media (max-width: 1200px) {
            .agent-grid { grid-template-columns: repeat(3, 1fr); }
            .activity-section { grid-template-columns: 1fr; }
            .perf-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .agent-grid { grid-template-columns: repeat(2, 1fr); }
            .dashboard { padding: 80px 20px 20px; }
            .connection-bar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <div>
                <h1>WebSocket Realtime</h1>
                <p class="subtitle">实时Agent状态监控与事件流</p>
            </div>
            <button class="refresh-btn" onclick="clearLogs()">清空日志</button>
        </div>

        <!-- Connection Status -->
        <div class="connection-bar">
            <div class="connection-status">
                <div class="status-indicator disconnected" id="statusIndicator"></div>
                <span class="status-text disconnected" id="statusText">未连接</span>
            </div>
            <div class="connection-info">
                <span>URL: <span class="ws-url" id="wsUrl">自动检测</span></span>
                <span>延迟: <span id="wsLatency">-</span></span>
                <span>消息: <span id="msgCount">0</span></span>
            </div>
            <button class="connect-btn connect" id="connectBtn" onclick="toggleConnection()">连接</button>
        </div>

        <!-- Performance Metrics -->
        <div class="perf-grid">
            <div class="perf-card">
                <div class="perf-header">
                    <span class="perf-label">CPU使用率</span>
                    <span class="perf-icon">💻</span>
                </div>
                <div class="perf-value" id="cpuValue">0%</div>
                <div class="perf-chart" id="cpuChart"></div>
            </div>
            <div class="perf-card">
                <div class="perf-header">
                    <span class="perf-label">内存使用</span>
                    <span class="perf-icon">🧠</span>
                </div>
                <div class="perf-value" id="memValue">0 MB</div>
                <div class="perf-chart" id="memChart"></div>
            </div>
            <div class="perf-card">
                <div class="perf-header">
                    <span class="perf-label">活跃任务</span>
                    <span class="perf-icon">⚡</span>
                </div>
                <div class="perf-value" id="taskValue">0</div>
                <div class="perf-chart" id="taskChart"></div>
            </div>
            <div class="perf-card">
                <div class="perf-header">
                    <span class="perf-label">消息/秒</span>
                    <span class="perf-icon">📨</span>
                </div>
                <div class="perf-value" id="msgRateValue">0</div>
                <div class="perf-chart" id="msgRateChart"></div>
            </div>
        </div>

        <!-- Agent Grid -->
        <div class="agent-grid" id="agentGrid">
            <div class="agent-card" data-agent="pm">
                <div class="agent-avatar pm">
                    📋
                    <div class="agent-status-dot online"></div>
                </div>
                <div class="agent-name">PM Agent</div>
                <div class="agent-status" id="pmStatus">就绪</div>
                <div class="agent-metrics">
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="pmTasks">0</div>
                        <div class="agent-metric-label">任务</div>
                    </div>
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="pmLatency">0ms</div>
                        <div class="agent-metric-label">延迟</div>
                    </div>
                </div>
            </div>
            <div class="agent-card" data-agent="dev">
                <div class="agent-avatar dev">
                    💻
                    <div class="agent-status-dot online"></div>
                </div>
                <div class="agent-name">Dev Agent</div>
                <div class="agent-status" id="devStatus">就绪</div>
                <div class="agent-metrics">
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="devTasks">0</div>
                        <div class="agent-metric-label">任务</div>
                    </div>
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="devLatency">0ms</div>
                        <div class="agent-metric-label">延迟</div>
                    </div>
                </div>
            </div>
            <div class="agent-card" data-agent="test">
                <div class="agent-avatar test">
                    🧪
                    <div class="agent-status-dot online"></div>
                </div>
                <div class="agent-name">Test Agent</div>
                <div class="agent-status" id="testStatus">就绪</div>
                <div class="agent-metrics">
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="testTasks">0</div>
                        <div class="agent-metric-label">任务</div>
                    </div>
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="testLatency">0ms</div>
                        <div class="agent-metric-label">延迟</div>
                    </div>
                </div>
            </div>
            <div class="agent-card" data-agent="doc">
                <div class="agent-avatar doc">
                    📝
                    <div class="agent-status-dot online"></div>
                </div>
                <div class="agent-name">Doc Agent</div>
                <div class="agent-status" id="docStatus">就绪</div>
                <div class="agent-metrics">
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="docTasks">0</div>
                        <div class="agent-metric-label">任务</div>
                    </div>
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="docLatency">0ms</div>
                        <div class="agent-metric-label">延迟</div>
                    </div>
                </div>
            </div>
            <div class="agent-card" data-agent="rag">
                <div class="agent-avatar rag">
                    🔍
                    <div class="agent-status-dot online"></div>
                </div>
                <div class="agent-name">RAG Agent</div>
                <div class="agent-status" id="ragStatus">就绪</div>
                <div class="agent-metrics">
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="ragTasks">0</div>
                        <div class="agent-metric-label">任务</div>
                    </div>
                    <div class="agent-metric">
                        <div class="agent-metric-value" id="ragLatency">0ms</div>
                        <div class="agent-metric-label">延迟</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="activity-section">
            <!-- Realtime Activity Feed -->
            <div class="activity-panel">
                <div class="activity-header">
                    <div class="activity-title">实时活动</div>
                    <div class="activity-badge" id="activityBadge">0 条新消息</div>
                </div>
                <div class="activity-feed" id="activityFeed">
                    <!-- Activity items will be added here -->
                </div>
            </div>

            <!-- Event Log -->
            <div class="event-panel">
                <div class="activity-header">
                    <div class="activity-title">事件日志</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted);" id="eventCount">0 事件</span>
                </div>
                <div class="event-log" id="eventLog">
                    <!-- Event items will be added here -->
                </div>
            </div>
        </div>

        <!-- Network Visualization -->
        <div class="canvas-section">
            <div class="canvas-header">
                <div class="canvas-title">Agent网络拓扑</div>
                <button class="refresh-btn" onclick="initNetworkCanvas()">重置视图</button>
            </div>
            <div class="canvas-container">
                <canvas id="agentNetworkCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const WS_URL = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/realtime`;

        let ws = null;
        let isConnected = false;
        let messageCount = 0;
        let reconnectAttempts = 0;
        let activityCount = 0;
        let eventCount = 0;

        // Performance data
        let perfData = {
            cpu: Array(20).fill(0),
            mem: Array(20).fill(0),
            tasks: Array(20).fill(0),
            msgRate: Array(20).fill(0)
        };

        // Agent simulation data
        const agentStates = {
            pm: { tasks: 0, latency: 0, status: 'idle' },
            dev: { tasks: 0, latency: 0, status: 'idle' },
            test: { tasks: 0, latency: 0, status: 'idle' },
            doc: { tasks: 0, latency: 0, status: 'idle' },
            rag: { tasks: 0, latency: 0, status: 'idle' }
        };

        function updateConnectionUI(connected, statusText) {
            const indicator = document.getElementById('statusIndicator');
            const statusEl = document.getElementById('statusText');
            const btn = document.getElementById('connectBtn');

            indicator.className = 'status-indicator ' + (connected ? 'connected' : 'disconnected');
            statusEl.className = 'status-text ' + (connected ? 'connected' : 'disconnected');
            statusEl.textContent = statusText;

            btn.textContent = connected ? '断开' : '连接';
            btn.className = 'connect-btn ' + (connected ? 'disconnect' : 'connect');
        }

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            updateConnectionUI(false, '连接中...');
            logEvent('info', '正在连接WebSocket...');

            // For demo purposes, simulate connection since real WS may not be available
            setTimeout(() => {
                isConnected = true;
                reconnectAttempts = 0;
                updateConnectionUI(true, '已连接');
                logEvent('success', 'WebSocket连接已建立');

                // Start simulation
                startSimulation();
                initNetworkCanvas();
            }, 1000);

            // Real WebSocket connection code (for production)
            /*
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    isConnected = true;
                    reconnectAttempts = 0;
                    updateConnectionUI(true, '已连接');
                    logEvent('success', 'WebSocket连接已建立');
                };

                ws.onmessage = (event) => {
                    handleMessage(JSON.parse(event.data));
                };

                ws.onclose = () => {
                    isConnected = false;
                    updateConnectionUI(false, '已断开');
                    logEvent('warning', 'WebSocket连接已关闭');
                    attemptReconnect();
                };

                ws.onerror = (error) => {
                    logEvent('error', 'WebSocket错误');
                };
            } catch (e) {
                logEvent('error', '连接失败: ' + e.message);
            }
            */
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            isConnected = false;
            updateConnectionUI(false, '已断开');
            logEvent('info', '用户主动断开连接');
        }

        function attemptReconnect() {
            if (reconnectAttempts < 5) {
                reconnectAttempts++;
                logEvent('info', `${reconnectAttempts * 2}秒后尝试重连...`);
                setTimeout(connect, reconnectAttempts * 2000);
            } else {
                logEvent('error', '重连次数超限，请检查服务器');
            }
        }

        function handleMessage(data) {
            messageCount++;
            document.getElementById('msgCount').textContent = messageCount;

            if (data.type === 'agent_update') {
                updateAgent(data.agent, data);
                addActivity(data.agent, data.message);
            } else if (data.type === 'metrics') {
                updateMetrics(data);
            }

            // Update latency
            document.getElementById('wsLatency').textContent = data.latency || '0ms';
        }

        function updateAgent(agentId, data) {
            const state = agentStates[agentId];
            if (state) {
                state.tasks = data.tasks || state.tasks;
                state.latency = data.latency || state.latency;
                state.status = data.status || state.status;

                document.getElementById(`${agentId}Tasks`).textContent = state.tasks;
                document.getElementById(`${agentId}Latency`).textContent = state.latency + 'ms';
                document.getElementById(`${agentId}Status`).textContent = getStatusText(state.status);

                const card = document.querySelector(`[data-agent="${agentId}"]`);
                card.className = 'agent-card';
                if (state.status === 'working') {
                    card.classList.add('working');
                } else if (state.status === 'error') {
                    card.classList.add('error');
                } else if (state.status === 'active') {
                    card.classList.add('active');
                }
            }
        }

        function getStatusText(status) {
            const statusMap = {
                'idle': '就绪',
                'active': '活跃',
                'working': '工作中',
                'error': '错误'
            };
            return statusMap[status] || status;
        }

        function addActivity(agentId, message) {
            const feed = document.getElementById('activityFeed');
            const icons = {
                'pm': '📋',
                'dev': '💻',
                'test': '🧪',
                'doc': '📝',
                'rag': '🔍'
            };

            const types = ['chat', 'rag', 'agent', 'success', 'error'];
            const type = types[Math.floor(Math.random() * types.length)];

            const item = document.createElement('div');
            item.className = 'activity-item';
            item.innerHTML = `
                <div class="activity-icon ${type}">${icons[agentId] || '🤖'}</div>
                <div class="activity-content">
                    <div class="activity-message"><strong>${agentId.toUpperCase()}</strong>: ${message}</div>
                    <div class="activity-time">${new Date().toLocaleTimeString()}</div>
                </div>
            `;

            feed.insertBefore(item, feed.firstChild);
            activityCount++;
            document.getElementById('activityBadge').textContent = `${activityCount} 条新消息`;

            // Keep only last 50 items
            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        function logEvent(type, message) {
            const log = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();

            const item = document.createElement('div');
            item.className = `event-item ${type}`;
            item.innerHTML = `
                <span class="event-time">${time}</span>
                <span class="event-type ${type}">${type.toUpperCase()}</span>
                <span class="event-msg">${message}</span>
            `;

            log.insertBefore(item, log.firstChild);
            eventCount++;
            document.getElementById('eventCount').textContent = `${eventCount} 事件`;

            // Keep only last 100 items
            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        function updateMetrics(data) {
            document.getElementById('cpuValue').textContent = data.cpu + '%';
            document.getElementById('memValue').textContent = data.memory + ' MB';
            document.getElementById('taskValue').textContent = data.activeTasks;
            document.getElementById('msgRateValue').textContent = data.msgRate;

            // Update charts
            perfData.cpu.push(data.cpu);
            perfData.cpu.shift();
            perfData.mem.push(data.memory / 10);
            perfData.mem.shift();
            perfData.tasks.push(data.activeTasks * 5);
            perfData.tasks.shift();
            perfData.msgRate.push(data.msgRate * 3);
            perfData.msgRate.shift();

            drawPerfCharts();
        }

        function drawPerfCharts() {
            ['cpu', 'mem', 'tasks', 'msgRate'].forEach(type => {
                const container = document.getElementById(`${type}Chart`);
                container.innerHTML = '';

                const colors = {
                    cpu: 'var(--accent-cyan)',
                    mem: 'var(--accent-purple)',
                    tasks: 'var(--accent-green)',
                    msgRate: 'var(--accent-yellow)'
                };

                perfData[type].forEach(value => {
                    const bar = document.createElement('div');
                    bar.className = 'perf-bar';
                    bar.style.background = colors[type];
                    bar.style.height = Math.min(value, 100) + '%';
                    container.appendChild(bar);
                });
            });
        }

        // Network Canvas
        let canvas, ctx;
        let nodes = [];
        let connections = [];

        function initNetworkCanvas() {
            canvas = document.getElementById('agentNetworkCanvas');
            ctx = canvas.getContext('2d');
            const container = canvas.parentElement;

            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Define nodes (agents and central hub)
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            nodes = [
                { id: 'hub', x: centerX, y: centerY, label: 'HUB', color: '#00f5ff', radius: 30 },
                { id: 'pm', x: centerX, y: centerY - radius, label: 'PM', color: '#bf00ff', radius: 20 },
                { id: 'dev', x: centerX + radius * 0.866, y: centerY - radius * 0.5, label: 'DEV', color: '#00ff88', radius: 20 },
                { id: 'test', x: centerX + radius * 0.866, y: centerY + radius * 0.5, label: 'TEST', color: '#ff006e', radius: 20 },
                { id: 'doc', x: centerX, y: centerY + radius, label: 'DOC', color: '#00f5ff', radius: 20 },
                { id: 'rag', x: centerX - radius * 0.866, y: centerY + radius * 0.5, label: 'RAG', color: '#ffbe2e', radius: 20 }
            ];

            connections = [
                ['hub', 'pm'], ['hub', 'dev'], ['hub', 'test'], ['hub', 'doc'], ['hub', 'rag'],
                ['pm', 'dev'], ['dev', 'test'], ['test', 'doc'], ['doc', 'rag'], ['rag', 'pm']
            ];

            drawNetwork();
        }

        function drawNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connections
            connections.forEach(([from, to]) => {
                const fromNode = nodes.find(n => n.id === from);
                const toNode = nodes.find(n => n.id === to);

                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);

                const gradient = ctx.createLinearGradient(fromNode.x, fromNode.y, toNode.x, toNode.y);
                gradient.addColorStop(0, fromNode.color + '60');
                gradient.addColorStop(1, toNode.color + '60');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw nodes
            nodes.forEach(node => {
                // Glow
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius + 10, 0, Math.PI * 2);
                const glow = ctx.createRadialGradient(node.x, node.y, node.radius, node.x, node.y, node.radius + 15);
                glow.addColorStop(0, node.color + '40');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.fill();

                // Node
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.fill();

                // Label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.label, node.x, node.y);
            });
        }

        function animateNetwork() {
            if (!isConnected) return;

            // Simulate node activity
            nodes.forEach(node => {
                if (node.id !== 'hub') {
                    node.x += (Math.random() - 0.5) * 0.5;
                    node.y += (Math.random() - 0.5) * 0.5;
                }
            });

            drawNetwork();
            requestAnimationFrame(animateNetwork);
        }

        // Simulation mode for demo
        function startSimulation() {
            // Simulate agent updates
            setInterval(() => {
                if (!isConnected) return;

                const agents = ['pm', 'dev', 'test', 'doc', 'rag'];
                const agentId = agents[Math.floor(Math.random() * agents.length)];

                const states = ['idle', 'active', 'working', 'error'];
                const messages = [
                    '处理新任务',
                    '完成代码审查',
                    '执行测试用例',
                    '生成文档',
                    '检索知识库',
                    '等待任务'
                ];

                updateAgent(agentId, {
                    tasks: Math.floor(Math.random() * 20),
                    latency: Math.floor(Math.random() * 200) + 20,
                    status: states[Math.floor(Math.random() * states.length)],
                    message: messages[Math.floor(Math.random() * messages.length)]
                });

                addActivity(agentId, messages[Math.floor(Math.random() * messages.length)]);

                messageCount++;
                document.getElementById('msgCount').textContent = messageCount;
                document.getElementById('wsLatency').textContent = Math.floor(Math.random() * 50 + 10) + 'ms';
            }, 1500);

            // Simulate metrics
            setInterval(() => {
                if (!isConnected) return;

                updateMetrics({
                    cpu: Math.floor(Math.random() * 40 + 20),
                    memory: Math.floor(Math.random() * 200 + 512),
                    activeTasks: Math.floor(Math.random() * 15),
                    msgRate: Math.floor(Math.random() * 20)
                });
            }, 2000);

            // Animate network
            animateNetwork();
        }

        function clearLogs() {
            document.getElementById('activityFeed').innerHTML = '';
            document.getElementById('eventLog').innerHTML = '';
            activityCount = 0;
            eventCount = 0;
            document.getElementById('activityBadge').textContent = '0 条新消息';
            document.getElementById('eventCount').textContent = '0 事件';
            logEvent('info', '日志已清空');
        }

        // Initialize
        window.addEventListener('resize', () => {
            if (canvas) initNetworkCanvas();
        });

        // Initial chart render
        drawPerfCharts();

        // Add initial demo activity
        logEvent('info', 'WebSocket实时监控已初始化');
        logEvent('success', '等待连接...');
    </script>
</body>
</html>
