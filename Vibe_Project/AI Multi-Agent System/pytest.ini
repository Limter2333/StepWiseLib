[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# Python文件匹配
python_files = test_*.py

# 测试类匹配
python_classes = Test*

# 测试函数匹配
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers

# 标记
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# 异步测试
asyncio_mode = auto
