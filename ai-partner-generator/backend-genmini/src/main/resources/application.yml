server:
  port: 8687

spring:
  application:
    name: backend-genmini
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Genmini AI 配置（本地 3000 端口）
genmini:
  # API 基础地址（本地服务）
  base-url: ${GENMINI_BASE_URL:http://localhost:3000}
  
  # 接口路径
  chat-endpoint: /api/chat
  image-endpoint: /v1beta/models/gemini-3-pro-image-preview:generateContent
  
  # 默认模型
  default-chat-model: ${GENMINI_CHAT_MODEL:genmini-chat-v1}
  default-image-model: ${GENMINI_IMAGE_MODEL:genmini-image-v1}

  # API Key 配置（可选，如果 Genmini 服务需要认证）
  api-key: ${GENMINI_API_KEY:}
  api-key-header: ${GENMINI_API_KEY_HEADER:Authorization}
  api-key-prefix: ${GENMINI_API_KEY_PREFIX:Bearer }
  
  # 超时配置（毫秒）
  connect-timeout: 30000
  read-timeout: 1500000
  write-timeout: 600000

# 日志配置
logging:
  level:
    com.github.sheven.genmini: DEBUG
    okhttp3: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# CORS 配置（开发环境）
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
